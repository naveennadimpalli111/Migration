<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title} ?: 'Fixed Parser Application'">Fixed Parser Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { font-family: system-ui, sans-serif; margin: 4rem; color: #111827; }
    .card {max-width: 720px; padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 10px;}
    a.btn {display: inline-block; margin-top: 1rem; color: white; background: #2563eb; padding: .5rem 1 rem; border-radius: 6px; text-decoration: none;}
  </style>
</head>
<body>
	<div class="card">
	  <h1 th:text="${issue} ?: 'Something went wrong'">Something went wrong</h1>
	  <p th:text="${message} ?: ' is out of range'"> is out of range</p>
	</div>
</body>
</html>
