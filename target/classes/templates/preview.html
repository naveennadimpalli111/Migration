<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${label}">Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    table { font-size: 0.9rem; }
    th, td { white-space: nowrap; }
    thead th { position: sticky; top: 0; background: #f8f9fa; z-index: 1; }
  </style>
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-2">
  <h3 th:text="${label}">Record Preview</h3>
  <a href="/" class="btn btn-link">&larr; Back</a>
</div>

<p class="text-muted">
  Charset: <strong th:text="${result.charsetName()}">Cp037</strong>
  <span th:if="${result.recordNumber() != null}">
    &nbsp;|&nbsp; Record #: <strong th:text="${result.recordNumber()}">1</strong>
  </span>
  <span th:if="${result.recordNumber() == null}">
    &nbsp;|&nbsp; Showing <strong th:text="${result.displayed()}">0</strong> of
    <strong th:text="${result.totalMatched()}">0</strong> matching records.
  </span>
</p>

<div class="table-responsive">
  <table class="table table-sm table-striped table-bordered">
    <thead>
      <tr>
        <th th:each="h : ${result.headers()}" th:text="${h}">Header</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${result.rows()}">
        <td th:each="c : ${r}" th:text="${c}"></td>
      </tr>
    </tbody>
  </table>
</div>

<div class="mt-3">
  <div class="small text-muted">
    <span>Filter: <code th:text="${result.filter() == null or #strings.isEmpty(result.filter()) ? '—' : result.filter()}">—</code></span>
    &nbsp;|&nbsp;
    <span>Sort: <code th:text="${result.sortBy()} + ' ' + ${result.sortDir()}">NONE ASC</code></span>
  </div>
</div>

</body>
</html>
