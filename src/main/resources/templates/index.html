<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ITS255 File Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">

<h3>ITS 255‑byte File Viewer</h3>
<p class="text-muted">Upload a raw ITS file and either enter a <strong>record number</strong> or choose a <strong>record type</strong> to preview.</p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/preview}" method="post" enctype="multipart/form-data" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Raw ITS file (fixed 255 bytes/record)</label>
    <input type="file" class="form-control" name="file" required>
  </div>

  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Record number (1-based, optional)</label>
      <input type="number" class="form-control" name="recordNumber" min="1" placeholder="e.g., 1">
      <div class="form-text">If provided, record type selection is ignored.</div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Record type (ignored if record # provided)</label>
      <select class="form-select" name="recordTypeCode">
        <option value="" selected>Choose…</option>
        <option value="05">05 — FM105</option>
        <option value="10">10 — FM110</option>
        <option value="15">15 — FM115</option>
        <option value="20">20 — FM120</option>
        <option value="30">30 — FM130</option>
        <option value="31">31 — FM131</option>
        <option value="32">32 — FM132</option>
        <option value="33">33 — FM133</option>
        <option value="40">40 — FM140</option>
        <option value="41">41 — FM141</option>
        <option value="42">42 — FM142</option>
        <option value="43">43 — FM143</option>
        <option value="44">44 — FM144</option>
        <option value="45">45 — FM145</option>
        <option value="46">46 — FM146</option>
        <option value="47">47 — FM147</option>
        <option value="50">50 — FM150</option>
        <option value="60">60 — FM160</option>
        <option value="65">65 — FM165</option>
        <option value="66">66 — FM166</option>
        <option value="71">71 — FM171</option>
        <option value="72">72 — FM172</option>
        <option value="73">73 — FM173</option>
        <option value="74">74 — FM174</option>
        <option value="80">80 — FM180</option>
        <option value="90">90 — FM190</option>
        <option value="9D">9D — FM9D</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Charset (optional)</label>
      <input type="text" class="form-control" name="charset" placeholder="Cp037 (default)">
    </div>

    <div class="col-md-3">
      <label class="form-label">Max rows (optional, default 200)</label>
      <input type="number" class="form-control" name="maxRows" min="1" max="5000">
    </div>
  </div>

  <hr class="my-3">

  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Filter (contains, optional)</label>
      <input type="text" class="form-control" name="q" placeholder="Search text across any column">
    </div>
    <div class="col-md-4">
      <label class="form-label">Sort by</label>
      <select class="form-select" name="sortBy">
        <option value="none">None</option>
        <option value="julian">Julian date (CC/YY/DDD)</option>
        <option value="serial">Serial number (sequence)</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Sort direction</label>
      <select class="form-select" name="sortDir">
        <option value="asc" selected>Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
  </div>

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Preview</button>
  </div>
</form>

<hr class="my-4">
<p class="text-muted small mb-0">
  Record type is detected from bytes 22–23 (COBOL 1‑based). Encoding defaults to Cp037.
</p>

</body>
</html>
