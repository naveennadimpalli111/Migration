<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>ITS255 Viewer — v3.2 (Chunked Mapping)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <style>code{white-space:pre-wrap}</style>

  <script>
    // --- Phase B: server parsing progress (polling) ---
    async function poll() {
      try {
        const r = await fetch('/viewer/progress?ts=' + Date.now(), { cache: 'no-store' });
        const j = await r.json();
        const serverPct = Math.round((j.progress || 0) * 100); 
        const mapped = Math.min(100, Math.max(80, 80 + Math.round(serverPct * 0.20)));

        const el = document.getElementById('pbar');
        if (el) {
          el.style.width = mapped + '%';
          el.innerText = mapped + '%';
        }
        if (mapped < 100) setTimeout(poll, 800);
      } catch (e) {
        setTimeout(poll, 1200);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uploadForm = document.querySelector('form[action="/viewer/upload"]');
      const fileInput  = uploadForm?.querySelector('input[type="file"][name="file"]');
      const pbar       = document.getElementById('pbar');

      if (fileInput && pbar) {
        fileInput.addEventListener('change', () => {
          pbar.classList.remove('bg-danger');
          pbar.style.width = '0%';
          pbar.innerText   = '0%';
        });
      }

      if (!uploadForm || !pbar) return;

      uploadForm.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const file = fileInput?.files?.[0];

        if (!file) {
          pbar.style.width = '0%';
          pbar.innerText   = '0%';
          return uploadForm.submit();
        }

        const formData = new FormData(uploadForm);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/viewer/upload', true);

        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          const rawPct = (e.loaded / e.total) * 100;
          const mapped = Math.max(0, Math.min(80, Math.round(rawPct * 0.80)));
          pbar.style.width = mapped + '%';
          pbar.innerText   = mapped + '%';
        };
        //const tStart = performance.now();
        xhr.onload = () => {
       // console.log('Upload roundtrip(ms):', performance.now() - tStart);

          if (xhr.status >= 200 && xhr.status < 300) {
            setTimeout(poll, 300);
          } else {
            pbar.classList.add('bg-danger');
            pbar.style.width = '100%';
            pbar.innerText   = 'Upload error';
          }
        };

        xhr.onerror = () => {
          pbar.classList.add('bg-danger');
          pbar.style.width = '100%';
          pbar.innerText   = 'Network error';
        };

        pbar.classList.remove('bg-danger');
        pbar.style.width = '1%';
        pbar.innerText   = '1%';

        xhr.send(formData);
      });
    });
  </script>
</head>


<body class="container py-3">
  <h1 class="mb-3">ITS255 Viewer — v3.2 (Chunked Mapping)</h1>

  <!-- UPLOAD FORM -->
  <form action="/viewer/upload" method="post" enctype="multipart/form-data" class="mb-3 border p-3 rounded">
    <div class="mb-2">
      <label class="form-label">EBCDIC File</label>
      <input type="file" name="file" class="form-control" required />
    </div>

    <button class="btn btn-primary">Upload</button>

    <!-- ▼ Added: filename (Version 1 feature restored) -->
    <small class="text-muted ms-2" th:if="${filename}">
      — <span th:text="${filename}">yourfile.dat</span>
    </small>

    <div class="progress mt-3" style="height:24px">
      <div id="pbar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
    </div>

    <div class="form-text">
      Chunked mapping is enabled (default 512MB windows). Prefix index length and workers are configurable via application.yml.
    </div>
  </form>


  <!-- SEARCH FORM -->
  <form action="/viewer/search" method="post" class="mb-3 border p-3 rounded">
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label">SCCF (prefix allowed)</label>
        <input type="text" name="sccf" class="form-control" placeholder="e.g., 9932601234" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Record Type</label>
        <input type="text" name="type" class="form-control" placeholder="e.g., 50" maxlength="2" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Record #</label>
        <input type="number" name="recNo" class="form-control" min="1" />
      </div>
      <div class="col-md-4 d-flex align-items-end gap-2">
        <button class="btn btn-success">Search</button>
        <a class="btn btn-outline-secondary" href="/viewer/export">Export (ZIP per type)</a>
      </div>
    </div>
    <div class="form-text">
      15 chars ⇒ strict match; shorter ⇒ prefix match via indexed buckets (configurable).
    </div>
  </form>


  <!-- NAVIGATION ROW -->
  <div class="d-flex align-items-center gap-2 mb-2" th:if="${hasFile}">

    <!-- Prev / Next -->
    <form th:action="@{/viewer/prev}" method="post">
      <button class="btn btn-outline-secondary" th:disabled="${!hasPrev}">◀ Prev</button>
    </form>
    <form th:action="@{/viewer/next}" method="post">
      <button class="btn btn-outline-secondary" th:disabled="${!hasNext}">Next ▶</button>
    </form>

    <span class="ms-2" th:text="|Record ${position} of ${count}|"></span>

    <!-- ▼ Added: Clear cached file button (aligned, unobtrusive) -->
    <form th:action="@{/viewer/clear}" method="post" class="ms-auto">
      <button class="btn btn-outline-danger btn-sm">
        Clear cached file
      </button>
    </form>
  </div>


  <!-- RECORD TABLE -->
  <div th:utext="${html}"></div>

</body>
</html>
